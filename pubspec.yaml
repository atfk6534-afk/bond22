name: bond2
description: "BOND2 - Offline-first private tutor management app (Arabic RTL)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Database (offline-first, relational, source of truth)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management (simple, predictable)
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # IDs
  uuid: ^4.4.0

  # QR generation + scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Permissions (camera for QR)
  permission_handler: ^11.3.1

  # File picking / opening / sharing
  file_picker: ^8.0.3
  open_filex: ^4.5.0
  share_plus: ^9.0.0

  # WhatsApp / phone call intents
  url_launcher: ^6.3.0

  # Archiving for backup packages (db + files -> single .bond2 file)
  archive: ^3.6.1

  # Secure PIN hashing (app lock)
  crypto: ^3.0.3

  # Formatting (Arabic-friendly dates/numbers)
  intl: ^0.19.0

  # CSV export
  csv: ^6.0.0

  # PDF report export
  pdf: ^3.11.0
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.11
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
