name: Build BOND2 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    name: Analyze, test, and build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Android Gradle Plugin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true # formatting issues shouldn't block APK delivery

      - name: Run analyzer
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Ensure Android SDK Platform 35 and NDK 26.1.10909125
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Diagnostic — Android SDK / NDK state
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- installed platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          echo "--- installed ndk ---"
          ls "$ANDROID_SDK_ROOT/ndk" || true
          echo "--- app compileSdk/ndkVersion ---"
          grep -E "compileSdk|ndkVersion" android/app/build.gradle || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK is valid and universal
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          echo "--- package / minSdk / supported ABIs ---"
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|native-code:" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bond2-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
